<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Our Flame - Together</title>
    <style>
        :root { 
            --bg-color: #000; --text-color: #fff; --my-border: #8A2BE2; --her-border: #FF69B4; 
            --panel-bg: rgba(30, 30, 30, 0.95);
        }
        body.light-theme { 
            --bg-color: #fff; --text-color: #000; 
            --panel-bg: rgba(240, 240, 240, 0.95);
        }
        body { 
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); 
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh; overflow: hidden; 
            transition: background 0.4s ease; 
        }
        .bg-pattern { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.25; pointer-events: none; }
        
        body:not(.light-theme) .bg-pattern { background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(10,10)'%3E%3Ccircle cx='10' cy='10' r='5' fill='white'/%3E%3Ccircle cx='10' cy='10' r='3' fill='%23FFD700'/%3E%3Ccircle cx='6' cy='4' r='2' fill='white'/%3E%3Ccircle cx='10' cy='2' r='2' fill='white'/%3E%3Ccircle cx='14' cy='4' r='2' fill='white'/%3E%3C/g%3E%3Cg transform='translate(60,60)'%3E%3Cellipse cx='10' cy='10' rx='8' ry='5' fill='white'/%3E%3Cpath d='M18,10 Q25,5 25,15' stroke='%23FF1493' fill='none' stroke-width='1.5'/%3E%3C/g%3E%3C/svg%3E"); }
        body.light-theme .bg-pattern { background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(10,10)'%3E%3Ccircle cx='10' cy='10' r='5' fill='black'/%3E%3Ccircle cx='10' cy='10' r='3' fill='%23FF69B4'/%3E%3Ccircle cx='6' cy='4' r='2' fill='black'/%3E%3Ccircle cx='10' cy='2' r='2' fill='black'/%3E%3Ccircle cx='14' cy='4' r='2' fill='black'/%3E%3C/g%3E%3Cg transform='translate(60,60)'%3E%3Cellipse cx='10' cy='10' rx='8' ry='5' fill='black'/%3E%3Cpath d='M18,10 Q25,5 25,15' stroke='%23FF1493' fill='none' stroke-width='1.5'/%3E%3C/g%3E%3C/svg%3E"); }

        .settings-btn { position: absolute; top: 20px; right: 20px; z-index: 101; font-size: 28px; cursor: pointer; }

        #settings-panel {
            position: fixed; top: 0; right: -300px; width: 260px; height: 100%;
            background: var(--panel-bg); z-index: 100; transition: 0.3s;
            padding: 60px 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 20px;
        }
        #settings-panel.open { right: 0; }
        
        button { padding: 12px; cursor: pointer; border-radius: 8px; border: none; background: #8A2BE2; color: white; font-weight: bold; }
        
        .container { position: relative; z-index: 10; text-align: center; }
        .avatar { width: 95px; height: 95px; border-radius: 50%; border: 4px solid var(--her-border); box-shadow: 0 0 20px var(--her-border); object-fit: cover; background: #222; }
        .me .avatar { border-color: var(--my-border); box-shadow: 0 0 25px var(--my-border); }
        #flame { font-size: 110px; cursor: pointer; display: inline-block; transition: 0.3s; margin-top: 20px; user-select: none; }
        .dying { animation: pulse 2s infinite alternate; filter: grayscale(0.4); }
        
        .confetti {
            position: fixed;
            top: -50px;
            z-index: 9999;
            pointer-events: none;
            animation: fall linear forwards;
        }
        
        @keyframes pulse { from { opacity: 0.7; transform: scale(1); } to { opacity: 1; transform: scale(1.08); } }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="settings-btn" onclick="document.getElementById('settings-panel').classList.toggle('open')">⚙️</div>

    <div id="settings-panel">
        <h3 style="text-align: center;">Настройки</h3>
        <button onclick="toggleTheme()">Сменить День/Ночь</button>
        <p style="font-size: 12px; opacity: 0.6; text-align: center; margin-top: 20px;">
            Для смены фото замени файлы avatar_me.png и avatar_her.png в GitHub
        </p>
        <button onclick="document.getElementById('settings-panel').classList.remove('open')" style="margin-top:auto; background: #444;">Закрыть</button>
    </div>

    <div class="bg-pattern"></div>
    <div class="container">
        <div style="display:flex; gap:20px; justify-content:center; margin-bottom:30px;">
            <div class="me"><img src="avatar_me.png" class="avatar"></div>
            <div class="her"><img src="avatar_her.png" class="avatar"></div>
        </div>
        <div id="flame" onclick="burn()">🔥</div>
        <div id="counter" style="font-size:70px; font-weight:bold;">Загрузка...</div>
        <div style="opacity: 0.5; letter-spacing: 2px;">ОБЩАЯ СЕРИЯ</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJlKLfey222tUZbqnXCNHgFv8IwWR2WJk",
            authDomain: "our-flame-53201.firebaseapp.com",
            projectId: "our-flame-53201",
            storageBucket: "our-flame-53201.firebasestorage.app",
            messagingSenderId: "464882526164",
            appId: "1:464882526164:web:7ea6e4a6af1a1448d19841",
            databaseURL: "https://our-flame-53201-default-rtdb.firebaseio.com/" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const flameRef = ref(db, 'shared_flame');

        const BOT_TOKEN = '8849874956:AAEFlXTywSZj-hM9UzR26C-VorbRVmQ3Hno';
        const USER_IDS = ['345744792', '1256661742'];

        let localData = { streak: 43, lastDate: "" };
        let isLoaded = false;

        window.toggleTheme = function() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('f_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        };
        if(localStorage.getItem('f_theme') === 'light') document.body.classList.add('light-theme');

        function createConfetti(amount, isMega) {
            for (let i = 0; i < amount; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.innerText = '💘';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.fontSize = isMega ? (Math.random() * 40 + 30) + 'px' : (Math.random() * 20 + 20) + 'px';
                const duration = Math.random() * 2 + 2;
                el.style.animationDuration = duration + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), duration * 1000);
            }
        }

        // Слушаем изменения
        onValue(flameRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // Если в базе число меньше 43, значит произошла ошибка сброса. Исправляем!
                if (data.streak < 43) {
                    set(flameRef, { streak: 44, lastDate: data.lastDate || "" });
                    localData = { streak: 44, lastDate: data.lastDate || "" };
                } else {
                    localData = data;
                }
            } else {
                // Если база вообще пустая
                set(flameRef, { streak: 43, lastDate: "" });
            }
            isLoaded = true;
            updateUI();
        });

        function updateUI() {
            document.getElementById('counter').innerText = localData.streak;
            const todayStr = new Date().toDateString();
            const f = document.getElementById('flame');

            if (localData.lastDate !== todayStr) {
                f.classList.add('dying');
            } else {
                f.classList.remove('dying');
            }
        }

        window.burn = function() {
            if (!isLoaded) return; 
            const todayStr = new Date().toDateString();
            
            // Если сегодня уже нажимали - просто выходим
            if (localData.lastDate === todayStr) return; 
            
            // Просто прибавляем 1 к тому, что есть в базе. Сброса в 0 НЕТ.
            const newStreak = Number(localData.streak) + 1;
            
            set(flameRef, { streak: newStreak, lastDate: todayStr });
            
            if (newStreak % 10 === 0) {
                createConfetti(100, true); 
            } else {
                createConfetti(30, false); 
            }

            USER_IDS.forEach(id => {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${id}&text=${encodeURIComponent("🔥 Огонек зажжен! Наша серия: " + newStreak)}`);
            });
        };
    </script>
</body>
</html>
