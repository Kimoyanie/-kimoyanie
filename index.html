<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Our Flame</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --my-border: #8A2BE2; /* Твой фиолетовый */
            --her-border: #FF69B4; /* Ее розовый */
            --paw-pad: #FFD700;   /* Желтые подушечки */
            --rat-body: #fff;     /* Белые крысы */
            --tail: #FF1493;      /* Розовые хвосты */
        }

        body.light-theme {
            --bg-color: #fff;
            --text-color: #000;
            --paw-pad: #FF69B4;   /* Розовые подушечки */
            --rat-body: #000;     /* Черные крысы */
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Фон с лапками и крысами */
        .background-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; opacity: 0.2; pointer-events: none;
            /* Здесь мы имитируем паттерн через градиенты */
            background-image: 
                radial-gradient(circle at 10% 10%, var(--paw-pad) 4px, transparent 8px),
                radial-gradient(circle at 30% 50%, var(--rat-body) 12px, transparent 15px);
            background-size: 150px 150px;
        }

        .container { position: relative; z-index: 10; text-align: center; }

        /* Аватарки */
        .avatars { display: flex; gap: 30px; margin-bottom: 40px; }
        .avatar-box { position: relative; }
        .avatar {
            width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
            border: 4px solid var(--her-border);
            box-shadow: 0 0 20px var(--her-border);
        }
        .me .avatar { 
            border-color: var(--my-border); 
            box-shadow: 0 0 25px var(--my-border); 
        }

        /* Огонек и его "бумеранг" анимация */
        #flame {
            font-size: 110px; cursor: pointer;
            user-select: none; transition: transform 0.2s;
        }
        
        .dying {
            animation: shake 0.6s infinite, dim 2s infinite alternate;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-6deg); }
            75% { transform: rotate(6deg); }
        }

        @keyframes dim {
            from { filter: brightness(0.5) grayscale(0.4); opacity: 0.6; }
            to { filter: brightness(1.2) drop-shadow(0 0 30px orange); opacity: 1; }
        }

        .hint { color: var(--tail); font-weight: bold; margin-top: 10px; display: none; font-size: 14px; }
        .dying + .hint { display: block; }

        /* Кнопка настроек */
        .settings-btn {
            position: absolute; top: 25px; left: 25px; font-size: 26px; cursor: pointer; z-index: 20;
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>
    <div class="settings-btn" onclick="toggleTheme()">⚙️</div>

    <div class="container">
        <div class="avatars">
            <div class="avatar-box">
                <img src="avatar_her.png" class="avatar">
                <div style="font-size: 12px; margin-top: 5px; color: var(--her-border)">@min_mina368</div>
            </div>
            <div class="avatar-box me">
                <img src="avatar_me.png" class="avatar">
                <div style="font-size: 12px; margin-top: 5px; color: var(--my-border)">@zow6666</div>
            </div>
        </div>

        <div id="flame" onclick="burn()">🔥</div>
        <div class="hint">я тухну зажги меня</div>
        
        <div style="font-size: 70px; font-weight: 900; margin-top: 20px;" id="count">0</div>
        <div style="opacity: 0.5; letter-spacing: 2px;">СЕРИЯ ДНЕЙ</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let streak = parseInt(localStorage.getItem('streak')) || 0;
        let lastClick = localStorage.getItem('lastClick') || "";

        function update() {
            document.getElementById('count').innerText = streak;
            const today = new Date().toDateString();
            const f = document.getElementById('flame');
            if (lastClick !== today) f.classList.add('dying');
            else f.classList.remove('dying');
        }

        function burn() {
            const today = new Date().toDateString();
            if (lastClick === today) {
                tg.showAlert("На сегодня огонек зажжен! 🔥");
                return;
            }
            streak++;
            lastClick = today;
            localStorage.setItem('streak', streak);
            localStorage.setItem('lastClick', lastClick);
            tg.HapticFeedback.impactOccurred('heavy');
            update();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            tg.HapticFeedback.impactOccurred('light');
        }

        update();
    </script>
</body>
</html>
