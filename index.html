<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Our Flame</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --my-border: #8A2BE2; /* Твой фиолетовый */
            --her-border: #FF69B4; /* Ее розовый */
            
            /* Темная тема: желтые подушечки, белые крысы */
            --paw-pad: %23FFD700; 
            --rat-body: %23ffffff;
            --tail-color: %23FF1493;
        }

        body.light-theme {
            --bg-color: #fff;
            --text-color: #000;
            
            /* Светлая тема: розовые подушечки, черные крысы */
            --paw-pad: %23FF69B4;
            --rat-body: %23000000;
            --tail-color: %23FF1493;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            transition: background 0.4s ease;
        }

        /* Фон с лапками и крысами через динамический SVG */
        .bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; opacity: 0.25; pointer-events: none;
        }

        /* Генерируем фон программно для соответствия ТЗ */
        body:not(.light-theme) .bg-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg id='paw' transform='translate(10,10)'%3E%3Ccircle cx='10' cy='10' r='5' fill='white'/%3E%3Ccircle cx='10' cy='10' r='3' fill='%23FFD700'/%3E%3Ccircle cx='6' cy='4' r='2' fill='white'/%3E%3Ccircle cx='10' cy='2' r='2' fill='white'/%3E%3Ccircle cx='14' cy='4' r='2' fill='white'/%3E%3C/g%3E%3Cg id='rat' transform='translate(60,60)'%3E%3Cellipse cx='10' cy='10' rx='8' ry='5' fill='white'/%3E%3Cpath d='M18,10 Q25,5 25,15' stroke='%23FF1493' fill='none' stroke-width='1.5'/%3E%3Ccircle cx='5' cy='8' r='1.5' fill='black'/%3E%3C/g%3E%3C/svg%3E");
        }

        body.light-theme .bg-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(10,10)'%3E%3Ccircle cx='10' cy='10' r='5' fill='black'/%3E%3Ccircle cx='10' cy='10' r='3' fill='%23FF69B4'/%3E%3Ccircle cx='6' cy='4' r='2' fill='black'/%3E%3Ccircle cx='10' cy='2' r='2' fill='black'/%3E%3Ccircle cx='14' cy='4' r='2' fill='black'/%3E%3C/g%3E%3Cg transform='translate(60,60)'%3E%3Cellipse cx='10' cy='10' rx='8' ry='5' fill='black'/%3E%3Cpath d='M18,10 Q25,5 25,15' stroke='%23FF1493' fill='none' stroke-width='1.5'/%3E%3Ccircle cx='5' cy='8' r='1.5' fill='white'/%3E%3C/g%3E%3C/svg%3E");
        }

        .container { position: relative; z-index: 10; text-align: center; width: 100%; }

        /* Аватарки */
        .avatars { display: flex; gap: 30px; justify-content: center; margin-bottom: 40px; }
        .avatar-box { display: flex; flex-direction: column; align-items: center; }
        .avatar {
            width: 95px; height: 95px; border-radius: 50%; object-fit: cover;
            border: 4px solid var(--her-border);
            box-shadow: 0 0 20px var(--her-border);
        }
        .me .avatar { 
            border-color: var(--my-border); 
            box-shadow: 0 0 25px var(--my-border); 
        }

        /* Огонек */
        #flame {
            font-size: 120px; cursor: pointer; user-select: none;
            transition: transform 0.2s; display: inline-block;
        }
        .active-flame { filter: drop-shadow(0 0 30px orange); }
        
        .dying { animation: bounce-shake 0.8s infinite, flicker 2s infinite alternate; }

        @keyframes bounce-shake {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1) rotate(3deg); }
        }

        @keyframes flicker {
            from { opacity: 0.6; filter: grayscale(0.5) brightness(0.7); }
            to { opacity: 1; filter: grayscale(0) brightness(1.2); }
        }

        .hint { color: #FF1493; font-weight: bold; margin-top: 15px; display: none; }
        .dying + .hint { display: block; }

        /* Счетчик и Настройки */
        #counter { font-size: 80px; font-weight: 900; margin-top: 10px; }
        .settings { position: absolute; top: 20px; left: 20px; font-size: 28px; cursor: pointer; z-index: 20; opacity: 0.6; }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>
    <div class="settings" onclick="toggleTheme()">⚙️</div>

    <div class="container">
        <div class="avatars">
            <div class="avatar-box">
                <img src="avatar_her.png" class="avatar">
                <div style="margin-top:8px; color:var(--her-border); font-weight:bold;">@min_mina368</div>
            </div>
            <div class="avatar-box me">
                <img src="avatar_me.png" class="avatar">
                <div style="margin-top:8px; color:var(--my-border); font-weight:bold;">@zow6666</div>
            </div>
        </div>

        <div id="flame" onclick="burn()">🔥</div>
        <div class="hint">Я ТУХНУ ЗАЖГИ МЕНЯ</div>
        
        <div id="counter">0</div>
        <div style="opacity: 0.5; letter-spacing: 2px; font-size: 12px;">СЕРИЯ ДНЕЙ</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let streak = parseInt(localStorage.getItem('f_streak')) || 0;
        let lastClick = localStorage.getItem('f_date') || "";

        function updateUI() {
            document.getElementById('counter').innerText = streak;
            const today = new Date().toDateString();
            const f = document.getElementById('flame');
            if (lastClick !== today) {
                f.classList.add('dying');
            } else {
                f.classList.remove('dying');
                f.classList.add('active-flame');
            }
        }

        function burn() {
            const today = new Date().toDateString();
            if (lastClick === today) {
                tg.showAlert("Огонек уже горит! 🔥");
                return;
            }
            streak++;
            lastClick = today;
            localStorage.setItem('f_streak', streak);
            localStorage.setItem('f_date', lastClick);
            tg.HapticFeedback.impactOccurred('heavy');
            updateUI();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            tg.HapticFeedback.impactOccurred('light');
        }

        updateUI();
    </script>
</body>
</html>
